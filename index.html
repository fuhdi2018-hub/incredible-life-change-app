<!DOCTYPE html>
<html lang="yo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2333">
<title>Ìyípadà Ìyanu Ìwàláàyè — Ìtòlẹ́sẹẹsẹ 1</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --ink:#1B2333; --ink-2:#242E44; --parchment:#F5EEDD; --charcoal:#2A241D;
    --gold:#C9A24B; --gold-soft:#E7D2A0; --ember:#8B4A3D;
    --serif: ui-serif, Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--ink); color:var(--parchment); font-family:var(--sans); height:100%;}
  #root{min-height:100vh; display:flex; flex-direction:column;}
  button{font-family:var(--sans); cursor:pointer;}
  ::selection{background:var(--gold-soft); color:var(--ink);}
  .app-body{flex:1; padding-bottom:78px;}

  .bottom-nav{ position:fixed; left:0; right:0; bottom:0; z-index:25; background:var(--ink-2); border-top:1px solid rgba(201,162,75,0.25); display:flex; padding: 6px 4px calc(6px + env(safe-area-inset-bottom));}
  .nav-btn{ flex:1; background:none; border:none; color:#8A90A3; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:9.5px; padding:6px 2px; border-radius:10px; transition: color 0.2s ease, transform 0.15s ease;}
  .nav-btn.active{ color:var(--gold); }
  .nav-btn:active{ transform:scale(0.92); }
  .nav-icon{ font-size:19px; line-height:1; }

  .section-title{ font-family:var(--serif); font-style:italic; font-size:18px; color:var(--gold-soft); margin:22px 16px 10px;}
  .card{ background:var(--ink-2); border-radius:14px; padding:16px 18px; margin:0 16px 12px; border:1px solid rgba(255,255,255,0.05);}
  .btn-gold{ background:linear-gradient(180deg, var(--gold), #B58E3E); color:var(--ink); border:none; border-radius:10px; padding:10px 16px; font-size:13px; font-weight:700;}
  .btn-gold:active{ transform:scale(0.97); }
  .btn-ghost{ background:var(--ink); border:1px solid rgba(255,255,255,0.14); color:#C9CEDB; border-radius:10px; padding:9px 14px; font-size:12.5px;}
  .btn-ghost:active{ transform:scale(0.97); }
  .fade-in{ animation: fadeIn 0.35s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .home-header{ background: radial-gradient(circle at 50% -10%, var(--ink-2), var(--ink) 65%); padding: 30px 20px 20px; border-bottom:1px solid rgba(201,162,75,0.2);}
  .home-flame-row{ display:flex; align-items:center; gap:12px; }
  .home-flame{ width:36px; height:auto; flex:0 0 auto; animation: flicker 2.6s ease-in-out infinite; transform-origin:50% 90%;}
  @keyframes flicker{ 0%,100%{ transform:scale(1) rotate(0deg); filter:brightness(1);} 25%{ transform:scale(1.04,0.97) rotate(-1.5deg); filter:brightness(1.08);} 50%{ transform:scale(0.97,1.04) rotate(1deg); filter:brightness(0.96);} 75%{ transform:scale(1.03,0.98) rotate(-0.5deg); filter:brightness(1.05);} }
  .home-greeting{ font-family:var(--serif); font-style:italic; font-size:19px; margin:0; color:var(--parchment);}
  .home-streak{ font-size:12px; color:var(--gold); margin-top:2px;}
  .home-eyebrow{ letter-spacing:0.18em; text-transform:uppercase; font-size:10px; color:#8A90A3; margin:0 0 6px;}
  .today-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 16px 6px;}
  .today-card{ background:var(--ink-2); border-radius:14px; padding:14px; border:1px solid rgba(255,255,255,0.05); display:flex; flex-direction:column; gap:6px; min-height:90px;}
  .today-label{ font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--gold);}
  .today-body{ font-size:12.5px; color:#D8DCE6; line-height:1.5; flex:1;}
  .continue-card{ margin:14px 16px; background:linear-gradient(135deg, var(--ink-2), #2C3552); border-radius:14px; padding:16px 18px; border:1px solid rgba(201,162,75,0.25); display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .continue-card .cc-title{ font-family:var(--serif); font-size:15px; color:var(--parchment); margin:0 0 3px;}
  .continue-card .cc-sub{ font-size:11px; color:#9AA1B4; margin:0;}
  .challenge-badge{ margin:0 16px 8px; display:flex; align-items:center; gap:10px; background:var(--ink-2); border-radius:14px; padding:12px 16px; border:1px solid rgba(255,255,255,0.05);}
  .challenge-ring{ width:40px; height:40px; border-radius:50%; flex:0 0 auto; background: conic-gradient(var(--gold) calc(var(--pct,0) * 1%), rgba(255,255,255,0.08) 0); display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--parchment); font-weight:700;}
  .challenge-ring span{ background:var(--ink-2); width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;}

  .cover-eyebrow{ letter-spacing:0.22em; text-transform:uppercase; font-size:11px; color:var(--gold); margin:0 0 10px;}
  .cover-title{ font-family:var(--serif); font-weight:700; font-style:italic; font-size:24px; line-height:1.2; margin:0 0 6px; color:var(--parchment); text-align:center; padding:0 16px;}
  .book-header{ text-align:center; padding: 22px 16px 8px;}
  .book-header .sub{ font-size:12px; color:#9AA1B4;}
  .toolbar{ display:flex; gap:10px; justify-content:center; padding:14px 22px 2px; flex-wrap:wrap;}
  .pill-btn{ background:var(--ink-2); color:var(--parchment); border:1px solid rgba(201,162,75,0.3); border-radius:20px; padding:8px 16px; font-size:13px; display:flex; align-items:center; gap:6px;}
  .about-card{ max-width:608px; margin:8px 16px 0; background:var(--ink-2); border-radius:14px; padding:16px 18px; border:1px solid rgba(201,162,75,0.2);}
  .about-card h3{ font-family:var(--serif); font-style:italic; font-size:15px; color:var(--gold-soft); margin:0 0 8px;}
  .about-card p{ font-size:13px; line-height:1.65; color:#C9CEDB; margin:0 0 10px;}
  .about-card .note{ font-size:11px; color:#6B7086; font-style:italic;}
  .chapter-list{ padding:18px 16px 20px; max-width:640px; margin:0 auto; width:100%;}
  .chapter-card{ display:flex; gap:14px; align-items:flex-start; background:var(--ink-2); border-radius:14px; padding:14px 16px; margin-bottom:10px; border:1px solid rgba(255,255,255,0.04);}
  .chapter-card:active{ transform:scale(0.98); }
  .chapter-num{ flex:0 0 auto; width:34px; height:34px; border-radius:50%; background:rgba(201,162,75,0.14); color:var(--gold); border:1px solid rgba(201,162,75,0.4); display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-size:14px; font-weight:700;}
  .chapter-info{flex:1; min-width:0;}
  .chapter-title{ font-family:var(--serif); font-size:15.5px; margin:2px 0 4px; color:var(--parchment); font-weight:600;}
  .chapter-snip{ font-size:12.5px; color:#9AA1B4; line-height:1.4; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
  .chapter-meta{ font-size:10.5px; color:var(--gold); margin-top:6px; letter-spacing:0.04em;}
  .read-dot{ width:7px; height:7px; border-radius:50%; background:var(--gold); display:inline-block; margin-right:5px;}
  footer.credit{ text-align:center; font-size:10.5px; color:#5C6178; padding:20px 0 12px;}

  .read-header{ position:sticky; top:0; z-index:5; background:rgba(27,35,51,0.92); backdrop-filter:blur(6px); padding:12px 14px; display:flex; align-items:center; gap:8px; border-bottom:1px solid rgba(201,162,75,0.2);}
  .icon-btn{ background:none; border:none; color:var(--parchment); font-size:18px; padding:6px; line-height:1;}
  .read-header-title{ flex:1; font-family:var(--serif); font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .lang-toggle{ background:var(--ink); border:1px solid var(--gold); color:var(--gold); border-radius:14px; padding:5px 10px; font-size:11px; font-weight:700; white-space:nowrap;}

  .page-wrap{ display:flex; justify-content:center; padding: 18px 14px 30px; }
  .page{ max-width:640px; width:100%; background:var(--parchment); color:var(--charcoal); border-radius:16px; padding: 26px 22px 34px; box-shadow: 0 10px 30px rgba(0,0,0,0.35);}
  .page.night{ background:#20242E; color:#DCE0EA; }
  .chap-title-lg{ font-family:var(--serif); font-style:italic; font-size:21px; margin:0 0 18px; text-align:center;}
  .para-heading{ font-family:var(--sans); text-transform:uppercase; letter-spacing:0.14em; font-size:11.5px; color:var(--ember); font-weight:700; margin: 22px 0 10px;}
  .page.night .para-heading{ color:var(--gold-soft); }
  .para-text{ font-family:var(--serif); font-size:17px; line-height:1.85; margin:0 0 14px; }
  .chapter-image{ display:block; max-width:100%; height:auto; margin:18px auto; border-radius:6px; background:#fff; padding:10px; box-shadow:0 2px 8px rgba(0,0,0,0.12); }
  .page.night .chapter-image{ background:#2A2E38; }

  .reader-controls{ position:sticky; bottom:0; z-index:6; background:var(--ink-2); border-top:1px solid rgba(201,162,75,0.25); padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); display:flex; justify-content:center; gap:10px; flex-wrap:wrap;}
  .mini-btn{ background:var(--ink); border:1px solid rgba(255,255,255,0.12); color:#C9CEDB; border-radius:10px; padding:7px 12px; font-size:11.5px;}

  .ltc-wrap{ max-width:640px; margin:0 auto; padding:0 14px 24px;}
  .ltc-step{ background:var(--ink-2); border-radius:14px; padding:16px 18px; margin-bottom:12px; border:1px solid rgba(255,255,255,0.05);}
  .ltc-label{ display:flex; align-items:center; gap:8px; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--gold); margin-bottom:10px;}
  .ltc-body{ font-family:var(--serif); font-size:15px; line-height:1.6; color:var(--parchment); font-style:italic;}
  .ltc-q{ font-size:13.5px; color:#D8DCE6; margin:10px 0 4px;}
  .ltc-textarea{ width:100%; background:var(--ink); border:1px solid rgba(255,255,255,0.12); color:var(--parchment); border-radius:10px; padding:10px 12px; font-size:13.5px; font-family:var(--sans); min-height:52px; resize:vertical;}
  .ltc-check{ display:flex; align-items:center; gap:8px; font-size:13px; color:#D8DCE6; margin-top:10px;}
  .ltc-check input{ width:18px; height:18px; accent-color:var(--gold);}
  .ltc-quiz-item{ margin-bottom:12px;}
  .ltc-quiz-q{ font-size:13.5px; color:var(--parchment); margin-bottom:6px;}
  .ltc-reveal{ font-size:12.5px; color:var(--gold-soft);}
  .ltc-soon{ font-size:12.5px; color:#8A90A3; font-style:italic;}
  .complete-btn{ width:100%; margin-top:4px;}

  .diacritic-row{ display:flex; gap:5px; flex-wrap:wrap; margin:6px 0 10px;}
  .dia-key{ background:var(--ink-2); border:1px solid rgba(201,162,75,0.3); color:var(--gold-soft); border-radius:8px; padding:5px 10px; font-size:14px; font-family:var(--serif);}

  .search-wrap{ padding:14px 16px 90px; max-width:640px; margin:0 auto; width:100%;}
  .search-input{ width:100%; padding:12px 14px; border-radius:12px; border:1px solid rgba(201,162,75,0.3); background:var(--ink-2); color:var(--parchment); font-size:15px;}
  .topic-grid{ display:flex; flex-wrap:wrap; gap:8px; margin:14px 0;}
  .topic-chip{ background:var(--ink-2); border:1px solid rgba(201,162,75,0.3); color:var(--gold-soft); border-radius:16px; padding:7px 14px; font-size:12.5px;}
  .topic-chip.active{ background:var(--gold); color:var(--ink); border-color:var(--gold);}
  .result-card{ background:var(--ink-2); border-radius:12px; padding:12px 14px; margin-top:10px; }
  .result-chap{ font-size:10.5px; color:var(--gold); letter-spacing:0.05em; text-transform:uppercase; margin-bottom:4px;}
  .result-snip{ font-size:13.5px; color:#D8DCE6; line-height:1.5;}
  mark{ background:var(--gold-soft); color:var(--ink); padding:0 1px; border-radius:2px;}
  .empty-state{ text-align:center; color:#8A90A3; font-size:13px; padding:40px 20px;}

  .prayer-card{ background:var(--ink-2); border-radius:14px; padding:16px 18px; margin:0 16px 12px; border:1px solid rgba(201,162,75,0.15);}
  .prayer-chap{ font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--gold); margin-bottom:6px;}
  .prayer-text{ font-family:var(--serif); font-style:italic; font-size:14.5px; line-height:1.6; color:var(--parchment);}
  .journal-entry{ background:var(--ink-2); border-radius:14px; padding:14px 18px; margin:0 16px 10px; border:1px solid rgba(255,255,255,0.05);}
  .journal-tag{ font-size:9.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--gold); margin-bottom:4px;}
  .journal-text{ font-size:13.5px; color:#D8DCE6; line-height:1.5;}
  .journal-date{ font-size:10px; color:#6B7086; margin-top:6px;}
  .journal-compose{ margin:0 16px 16px; background:var(--ink-2); border-radius:14px; padding:14px 16px; border:1px solid rgba(255,255,255,0.05);}
  .journal-cat-row{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;}
  .cat-chip{ background:var(--ink); border:1px solid rgba(255,255,255,0.12); color:#C9CEDB; border-radius:12px; padding:5px 11px; font-size:11px;}
  .cat-chip.active{ background:var(--gold); color:var(--ink); border-color:var(--gold);}

  .confetti-layer{ position:fixed; inset:0; pointer-events:none; z-index:60; overflow:hidden;}
  .confetti-piece{ position:absolute; top:-10px; border-radius:2px; animation: confettiFall 1.6s ease-in forwards;}
  @keyframes confettiFall{ to{ transform: translateY(110vh) rotate(540deg); opacity:0.2;} }

  .flip-cover-stage{ position:fixed; inset:0; z-index:30; perspective:1800px; }
  .flip-cover{ position:absolute; inset:0; transform-style:preserve-3d; transform-origin:left center; transition: transform 1.05s cubic-bezier(.62,.08,.29,1); cursor:pointer; z-index:20;}
  .flip-cover.open{ transform: rotateY(-178deg); pointer-events:none; }
  .cover-face{ position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 26px; text-align:center;}
  .cover-front{ background: radial-gradient(circle at 50% 18%, #2B3654, var(--ink) 68%); box-shadow: inset 0 0 0 1px rgba(201,162,75,0.25), 8px 0 24px rgba(0,0,0,0.5); border-radius: 4px 14px 14px 4px;}
  .cover-back{ background: linear-gradient(135deg, #EFE6D0, #E4D8B8); transform: rotateY(180deg); color: var(--charcoal); border-radius: 14px 4px 4px 14px;}
  .cover-illustration{ width:64%; max-width:230px; margin-bottom:18px; }
  .cover-title-front{ font-family:var(--serif); font-style:italic; font-weight:700; font-size:23px; line-height:1.2; color:var(--parchment); margin:0 0 8px;}
  .cover-sub-front{ font-family:var(--serif); font-size:12.5px; color:var(--gold-soft); margin:0 0 14px; font-style:italic;}
  .cover-series-front{ font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:#9AA1B4; border-top:1px solid rgba(201,162,75,0.3); border-bottom:1px solid rgba(201,162,75,0.3); padding:8px 0; margin-bottom:14px;}
  .cover-author-front{ font-family:var(--serif); font-style:italic; font-size:14px; color:var(--gold);}
  .tap-hint{ position:absolute; bottom:26px; left:0; right:0; text-align:center; font-size:11px; color:#8A90A3; letter-spacing:0.06em; animation: pulseHint 2.2s ease-in-out infinite;}
  @keyframes pulseHint{ 0%,100%{opacity:0.45;} 50%{opacity:1;} }
  .cover-back-title{ font-family:var(--sans); font-weight:700; letter-spacing:0.02em; font-size:13px; margin-bottom:4px;}

  @media (prefers-reduced-motion: reduce){ .flip-cover{ transition:none; } .tap-hint{ animation:none; } .home-flame{ animation:none; } }
</style>
</head>
<body>
<div id="root"></div>

<script src="book-data.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://unpkg.com/docx@8.5.0/dist/index.iife.js"></script>
<script>
const h = React.createElement;
const { useState, useEffect, useMemo, useRef } = React;

const BOOK = window.BOOK_DATA_YO;
const BOOK_EN = window.BOOK_DATA_EN;
const LS_BOOKMARK = 'ilcyo_bookmark_v1';
const LS_SETTINGS = 'ilcyo_settings_v1';
const LS_READ = 'ilcyo_read_v1';
const LS_JOURNAL = 'ilcyo_journal_v1';
const LS_STREAK = 'ilcyo_streak_v1';
const LS_COMPLETED = 'ilcyo_completed_v1';

// Chapter 1 content — approved draft, Yoruba
const CHAPTER_EXTRAS = {
  ch1: {
    prayer: "Olúwa, gbà mí lọ́wọ́ jíjẹ́ onígbàgbọ́ lásán tí ohun tí mo rí nìkan ń darí. Sọ mí di ọmọ-ẹ̀yìn tòótọ́ — ẹni tí ó ń ṣègbọràn sí Ọ pátápátá, kì í ṣe ẹni tí ń tẹ̀lé nítorí iṣẹ́ ìyanu tí ó sì ń padà sẹ́yìn kí ó tó dé àgbélébùú. Jẹ́ kí a dán ìgbàgbọ́ mi wò kí ó sì di ẹni tí a rí i pé ó jẹ́ òtítọ́.",
    reflect: [
      "Kí ni ìyàtọ̀ tí orí yìí fi hàn láàrin \"onígbàgbọ́\" àti \"ọmọ-ẹ̀yìn\"?",
      "Níbo nínú ìgbésí ayé mi ni mo ti tẹ́lọ́rùn pẹ̀lú gbígbàgbọ́ láìsí kí n ṣègbọràn?",
      "Kí ni ó jẹ́ nípa àwọn ọmọ-ẹ̀yìn tí ó mú kí Jésù gbẹ́kẹ̀lé wọn pẹ̀lú Àṣẹ Ńlá náà?",
      "Kí ni yóò rí bí mo bá yí padà láti jẹ́ olùwòran sí ọmọ-ẹ̀yìn ní ọ̀sẹ̀ yìí?",
      "Ẹsẹ Ìwé Mímọ́ wo nínú orí yìí ni mo fẹ́ rántí?"
    ],
    action: "Dárúkọ agbègbè kan tí o ti ń 'gbàgbọ́' láì ṣègbọràn. Gbé ìgbésẹ̀ kan pàtó sí ìgbọràn nínú rẹ̀ lónìí.",
    quiz: [
      { q: "Àjọ̀dún wo ni ń lọ lọ́wọ́ nígbà tí Jésù wẹ tẹmpìlì mọ́?", a: "Ìrékọjá" },
      { q: "Gẹ́gẹ́ bí orí yìí ṣe sọ, kí ni ọ̀pọ̀lọpọ̀ \"onígbàgbọ́\" fi ìgbàgbọ́ wọn lélẹ̀?", a: "Iṣẹ́ ìyanu, kì í ṣe ọ̀rọ̀ Ọlọ́run" },
      { q: "Kí ni Jésù pàṣẹ fún àwọn ọmọ-ẹ̀yìn láti ṣe nínú Matteu 28?", a: "Kí wọn lọ kọ́ gbogbo orílẹ̀-èdè" }
    ]
  }
};

const QUOTES = [
  { text: "Kò ní ìgbẹ́kẹ̀lé pé àwọn onígbàgbọ́ lásán tóótun láti gbé Ìjọba Ọlọ́run kalẹ̀ lórí ilẹ̀ ayé.", chapter: "Ọ̀jọ̀ Àyẹ̀yẹ́" },
  { text: "Kò lè gbẹ́kẹ̀lé agbára àwọn onígbàgbọ́ lásán láti bá agbára òkùnkùn jà.", chapter: "Ọ̀jọ̀ Àyẹ̀yẹ́" }
];

// ---------- Diacritic-insensitive matching ----------
function normalizeYo(text){
  return text.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}
const DIACRITIC_KEYS = ['ẹ','ọ','ṣ','ń','à','á','è','é','ì','í','ò','ó','ù','ú'];

function loadJSON(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; }
}
function saveJSON(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function dailyPick(list){
  const d = new Date();
  const seed = d.getFullYear()*372 + d.getMonth()*31 + d.getDate();
  return list[seed % list.length];
}

function useStreak(){
  const [streak, setStreak] = useState(() => loadJSON(LS_STREAK, {count:0, last:null}));
  useEffect(() => {
    const today = todayStr();
    if(streak.last === today) return;
    const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0,10);
    let next;
    if(streak.last === yesterday){ next = {count: streak.count + 1, last: today}; }
    else { next = {count: 1, last: today}; }
    setStreak(next);
    saveJSON(LS_STREAK, next);
  }, []);
  return streak;
}

function Confetti(){
  const pieces = useMemo(() => Array.from({length:26}, (_,i) => ({
    id:i, left: Math.random()*100, delay: Math.random()*0.4, size: 5 + Math.random()*5,
    color: [ '#C9A24B', '#E7D2A0', '#8B4A3D', '#F5EEDD' ][i % 4]
  })), []);
  return h('div', {className:'confetti-layer'},
    pieces.map(p => h('div', {
      key:p.id, className:'confetti-piece',
      style:{ left:p.left+'%', width:p.size, height:p.size*1.4, background:p.color, animationDelay:p.delay+'s' }
    }))
  );
}

function App(){
  const [tab, setTab] = useState('home');
  const [view, setView] = useState('list');
  const [chapterId, setChapterId] = useState(null);
  const [settings, setSettings] = useState(() => loadJSON(LS_SETTINGS, { fontSize: 18, night: false }));
  const [bookmark, setBookmark] = useState(() => loadJSON(LS_BOOKMARK, null));
  const [readChapters, setReadChapters] = useState(() => loadJSON(LS_READ, {}));
  const [completed, setCompleted] = useState(() => loadJSON(LS_COMPLETED, {}));
  const [journal, setJournal] = useState(() => loadJSON(LS_JOURNAL, []));
  const [hasOpenedBook, setHasOpenedBook] = useState(false);
  const [confetti, setConfetti] = useState(false);
  const streak = useStreak();

  useEffect(() => { saveJSON(LS_SETTINGS, settings); }, [settings]);
  useEffect(() => { saveJSON(LS_BOOKMARK, bookmark); }, [bookmark]);
  useEffect(() => { saveJSON(LS_READ, readChapters); }, [readChapters]);
  useEffect(() => { saveJSON(LS_COMPLETED, completed); }, [completed]);
  useEffect(() => { saveJSON(LS_JOURNAL, journal); }, [journal]);

  const openChapter = (id) => { setChapterId(id); setView('reading'); setTab('book'); };
  const backToList = () => setView('list');
  const addJournalEntry = (entry) => setJournal(j => [{ ...entry, id: Date.now(), date: new Date().toISOString() }, ...j]);
  const markChapterComplete = (id) => {
    if(!completed[id]){
      setCompleted(c => ({...c, [id]: true}));
      setConfetti(true);
      setTimeout(() => setConfetti(false), 1700);
    }
  };
  const challengeDays = Math.min(12, Object.keys(completed).length);

  return h('div', {style:{display:'flex', flexDirection:'column', flex:1}},
    confetti && h(Confetti),
    view === 'reading' && chapterId
      ? h(Reader, {
          chapterId, settings, setSettings, bookmark, setBookmark,
          onBack: backToList,
          onFinishChapter: (id) => setReadChapters(r => ({...r, [id]: true})),
          onMarkComplete: markChapterComplete,
          completed, addJournalEntry
        })
      : h(React.Fragment, null,
          h('div', {className:'app-body'},
            tab === 'home' && h(Home, {
              bookmark, streak, challengeDays,
              onContinue: () => bookmark && openChapter(bookmark.chapterId),
              onGoBook: () => setTab('book')
            }),
            tab === 'book' && h('div', {style:{position:'relative'}},
              h(BookTab, { bookmark, onContinue: () => openChapter(bookmark.chapterId), onOpenChapter: openChapter, readChapters, completed }),
              !hasOpenedBook && h(FlipCover, { onOpen: () => setHasOpenedBook(true) })
            ),
            tab === 'explore' && h(Explore, {}),
            tab === 'prayer' && h(PrayerTab, { completed }),
            tab === 'journal' && h(JournalTab, { journal, addJournalEntry })
          ),
          h(BottomNav, { tab, setTab })
        )
  );
}

function LiveTheChapter({ chapter, completed, onMarkComplete, addJournalEntry }){
  const extra = CHAPTER_EXTRAS[chapter.id];
  const [answers, setAnswers] = useState(() => Array((extra && extra.reflect.length) || 0).fill(''));
  const [prayed, setPrayed] = useState(false);
  const [acted, setActed] = useState(false);
  const [showQuiz, setShowQuiz] = useState(false);
  const [focusedIdx, setFocusedIdx] = useState(null);
  const taRefs = useRef([]);

  const insertChar = (idx, ch) => {
    const ta = taRefs.current[idx];
    if(!ta) return;
    const start = ta.selectionStart || 0, end = ta.selectionEnd || 0;
    const val = answers[idx];
    const next = val.slice(0,start) + ch + val.slice(end);
    setAnswers(a => a.map((v,i)=> i===idx ? next : v));
    requestAnimationFrame(() => { ta.focus(); ta.selectionStart = ta.selectionEnd = start + ch.length; });
  };

  const recordAndComplete = () => {
    if(extra){
      answers.forEach((a, i) => {
        if(a.trim()){
          addJournalEntry({ category:'Ìrò Inú', text: a.trim(), chapterTitle: chapter.title, chapterId: chapter.id, prompt: extra.reflect[i] });
        }
      });
    }
    onMarkComplete(chapter.id);
  };

  return h('div', {className:'ltc-wrap'},
    h('div', {className:'section-title'}, 'Gbé Orí Náà Jáde'),
    h('div', {className:'ltc-step'},
      h('div', {className:'ltc-label'}, '\ud83d\ude4f Gbàdúrà Èyí'),
      extra ? h(React.Fragment, null,
        h('p', {className:'ltc-body'}, '\u201c' + extra.prayer + '\u201d'),
        h('label', {className:'ltc-check'}, h('input', {type:'checkbox', checked:prayed, onChange:e=>setPrayed(e.target.checked)}), 'Mo ti gbàdúrà èyí')
      ) : h('p', {className:'ltc-soon'}, 'À ń múra àdúrà fún orí yìí.')
    ),
    h('div', {className:'ltc-step'},
      h('div', {className:'ltc-label'}, '\ud83e\udde0 Kí Ni Mo Kọ́?'),
      extra ? extra.reflect.map((q, i) => h('div', {key:i},
        h('div', {className:'ltc-q'}, q),
        focusedIdx === i && h('div', {className:'diacritic-row'},
          DIACRITIC_KEYS.map(dk => h('button', {key:dk, className:'dia-key', type:'button',
            onMouseDown:(e)=>e.preventDefault(), onClick:() => insertChar(i, dk)}, dk))
        ),
        h('textarea', {
          ref: el => taRefs.current[i] = el,
          className:'ltc-textarea', value:answers[i],
          onFocus:() => setFocusedIdx(i),
          onChange:e => setAnswers(a => a.map((v,idx)=> idx===i ? e.target.value : v)),
          placeholder:'Kọ ìdáhùn rẹ\u2026'
        })
      )) : h('p', {className:'ltc-soon'}, 'À ń múra àwọn ìbéèrè fún orí yìí.')
    ),
    h('div', {className:'ltc-step'},
      h('div', {className:'ltc-label'}, '\ud83c\udfaf Ṣe É Lónìí'),
      extra ? h(React.Fragment, null,
        h('p', {className:'ltc-body'}, extra.action),
        h('label', {className:'ltc-check'}, h('input', {type:'checkbox', checked:acted, onChange:e=>setActed(e.target.checked)}), 'Mo ti ṣe é')
      ) : h('p', {className:'ltc-soon'}, 'À ń múra iṣe fún orí yìí.')
    ),
    extra && h('div', {className:'ltc-step'},
      h('div', {className:'ltc-label'}, '\ud83e\udde9 Dán Ara Rẹ Wò'),
      !showQuiz ? h('button', {className:'btn-ghost', onClick:() => setShowQuiz(true)}, 'Bẹ̀rẹ̀')
        : extra.quiz.map((item, i) => h(QuizItem, {key:i, item}))
    ),
    h('button', {className:'btn-gold complete-btn', onClick:recordAndComplete},
      completed[chapter.id] ? '\u2713 Orí Ti Parí \u2014 Ṣàtúnṣe Àkọsílẹ̀' : 'Sàmì Sí Orí Tí Parí, Fi Pamọ́ sí Àkọsílẹ̀'
    )
  );
}

function Explore(){
  const [q, setQ] = useState('');
  const [activeTopic, setActiveTopic] = useState(null);
  const effectiveQuery = activeTopic || q;
  const results = useMemo(() => {
    if(effectiveQuery.trim().length < 2) return [];
    const needle = normalizeYo(effectiveQuery.trim());
    const out = [];
    for(const c of BOOK.chapters){
      for(const p of c.paragraphs){
        if(p.type !== 'text') continue;
        const low = normalizeYo(p.text);
        const idx = low.indexOf(needle);
        if(idx !== -1){
          const start = Math.max(0, idx-50);
          const end = Math.min(p.text.length, idx+needle.length+70);
          out.push({ chapterId: c.id, chapterTitle: c.title, snippet: (start>0?'\u2026':'') + p.text.slice(start, end) + (end<p.text.length?'\u2026':'') });
          if(out.length >= 40) return out;
        }
      }
    }
    return out;
  }, [effectiveQuery]);

  return h('div', {className:'fade-in'},
    h('div', {className:'section-title'}, 'Wá Nínú Ìwé Náà'),
    h('div', {className:'search-wrap', style:{paddingTop:0}},
      h('input', { className:'search-input', placeholder:'Wá nínú ìwé\u2026 (fún àpẹẹrẹ: ibẹru tàbí ìbẹ̀rù)', value:q, onChange: e => { setQ(e.target.value); setActiveTopic(null); } }),
      h('p', {style:{fontSize:'11px', color:'#6B7086', margin:'6px 2px 0'}}, 'Ìwádìí yìí kò bìkítà nípa àmì-ohùn — "oko" yóò rí "ọkọ" pẹ̀lú.'),
      h('div', {className:'topic-grid'},
        TOPICS.map(t => h('button', { key:t, className:'topic-chip' + (activeTopic===t ? ' active' : ''), onClick: () => { setActiveTopic(activeTopic===t ? null : t); setQ(''); } }, t))
      ),
      effectiveQuery.trim().length >= 2 && results.length === 0 && h('div', {className:'empty-state'}, 'Kò sí ohun tí a rí.'),
      results.map((r, i) => h('div', {key:i, className:'result-card'},
        h('div', {className:'result-chap'}, r.chapterTitle),
        h('div', {className:'result-snip'}, r.snippet)
      ))
    )
  );
}

function PrayerTab({ completed }){
  const chaptersWithPrayers = BOOK.chapters.filter(c => CHAPTER_EXTRAS[c.id]);
  const [wisdom, setWisdom] = useState(null);
  return h('div', {className:'fade-in'},

      : chaptersWithPrayers.map(c => h('div', {key:c.id, className:'prayer-card'}, h('div', {className:'prayer-chap'}, c.title), h('div', {className:'prayer-text'}, '\u201c' + CHAPTER_EXTRAS[c.id].prayer + '\u201d')))
  );

const JOURNAL_CATS = ['Àdúrà','Ìrò Inú','Ẹ̀rí','Ọpẹ́','Ẹ̀kọ́','Ìbéèrè','Ìpinnu'];

function JournalTab({ journal, addJournalEntry }){
  const [cat, setCat] = useState('Ìrò Inú');
  const [text, setText] = useState('');
  const [focused, setFocused] = useState(false);
  const taRef = useRef(null);

  const insertChar = (ch) => {
    const ta = taRef.current;
    if(!ta) return;
    const start = ta.selectionStart || 0, end = ta.selectionEnd || 0;
    const next = text.slice(0,start) + ch + text.slice(end);
    setText(next);
    requestAnimationFrame(() => { ta.focus(); ta.selectionStart = ta.selectionEnd = start + ch.length; });
  };

  const submit = () => { if(!text.trim()) return; addJournalEntry({ category:cat, text:text.trim() }); setText(''); };

  return h('div', {className:'fade-in'},
    h('div', {className:'section-title'}, 'Àkọsílẹ̀ Mi'),
    h('div', {className:'journal-compose'},
      h('div', {className:'journal-cat-row'}, JOURNAL_CATS.map(c => h('button', {key:c, className:'cat-chip' + (cat===c ? ' active' : ''), onClick:() => setCat(c)}, c))),
      focused && h('div', {className:'diacritic-row'}, DIACRITIC_KEYS.map(dk => h('button', {key:dk, className:'dia-key', type:'button', onMouseDown:e=>e.preventDefault(), onClick:() => insertChar(dk)}, dk))),
      h('textarea', { ref:taRef, className:'ltc-textarea', value:text, onFocus:()=>setFocused(true), onChange:e=>setText(e.target.value), placeholder:'Kọ ' + cat.toLowerCase() + ' rẹ\u2026' }),
      h('div', {style:{marginTop:8}}, h('button', {className:'btn-gold', onClick:submit}, 'Fi Pamọ́'))
    ),
    journal.length === 0 && h('div', {className:'empty-state'}, 'Àwọn ìrò, àdúrà, àti àkọsílẹ̀ rẹ yóò farahàn níbí.'),
    journal.map(e => h('div', {key:e.id, className:'journal-entry'},
      h('div', {className:'journal-tag'}, e.category + (e.chapterTitle ? ' \u00b7 ' + e.chapterTitle : '')),
      e.prompt && h('div', {style:{fontSize:'11.5px', color:'#9AA1B4', marginBottom:4, fontStyle:'italic'}}, e.prompt),
      h('div', {className:'journal-text'}, e.text),
      h('div', {className:'journal-date'}, new Date(e.date).toLocaleDateString())
    )),
    h('div', {style:{padding:'0 16px 20px'}},
      h('div', {className:'dl-row'},
        h('button', {className:'btn-ghost', onClick: () => downloadBookWithNotes(journal)}, '\u2b07 PDF \u2014 Ìwé + Àkọsílẹ̀'),
        h('button', {className:'btn-ghost', onClick: () => downloadBookWithNotesWord(journal)}, '\u2b07 Word \u2014 Ìwé + Àkọsílẹ̀')
      )
    )
  );
}

function buildFullText(){
  let out = BOOK.title + '\n\n';
  BOOK.chapters.forEach(c => {
    out += 'ORÍ ' + c.num + ': ' + c.title + '\n\n';
    c.paragraphs.forEach(p => { out += p.text + '\n\n'; });
  });
  return out;
}

let _pdfFontCache = null;
async function loadPdfFont(doc){
  if(!_pdfFontCache){
    const resp = await fetch('fonts/DejaVuSans.ttf');
    const buf = await resp.arrayBuffer();
    let binary = '';
    const bytes = new Uint8Array(buf);
    const chunk = 0x8000;
    for(let i = 0; i < bytes.length; i += chunk){
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    _pdfFontCache = btoa(binary);
  }
  doc.addFileToVFS('DejaVuSans.ttf', _pdfFontCache);
  doc.addFont('DejaVuSans.ttf', 'DejaVuSans', 'normal');
  doc.setFont('DejaVuSans');
  doc.setFontSize(11);
}

async function downloadBookOnlyPDF(){
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    await loadPdfFont(doc);
    const text = buildFullText();
    const lines = doc.splitTextToSize(text, 180);
    let y = 20;
    lines.forEach(line => { if(y > 280){ doc.addPage(); doc.setFont('DejaVuSans'); y = 20; } doc.text(line, 15, y); y += 7; });
    doc.save('iyipada-iyanu-iwalaaye-yoruba.pdf');
  }catch(e){ alert('Download failed: ' + e.message); }
}

async function buildWordDoc(withNotes, journal){
  const { Document, Paragraph, TextRun, HeadingLevel, Packer } = window.docx;
  const children = [
    new Paragraph({ text: BOOK.title, heading: HeadingLevel.TITLE }),
    new Paragraph({ children: [ new TextRun({ text: 'Kunle Bello ni ó kọ ọ́', italics: true }) ] })
  ];
  BOOK.chapters.forEach(c => {
    children.push(new Paragraph({ text: 'ORÍ ' + c.num + ': ' + c.title, heading: HeadingLevel.HEADING_1, pageBreakBefore: true }));
    c.paragraphs.forEach(p => {
      children.push(new Paragraph({ text: p.text, heading: p.type === 'heading' ? HeadingLevel.HEADING_3 : undefined }));
    });
  });
  if(withNotes && journal && journal.length){
    children.push(new Paragraph({ text: 'Àkọsílẹ̀ Mi', heading: HeadingLevel.HEADING_1, pageBreakBefore: true }));
    journal.slice().reverse().forEach(e => {
      children.push(new Paragraph({
        heading: HeadingLevel.HEADING_3,
        children: [ new TextRun({ text: '[' + e.category + (e.chapterTitle ? (' \u2014 ' + e.chapterTitle) : '') + '] ' + new Date(e.date).toLocaleDateString() }) ]
      }));
      if(e.prompt) children.push(new Paragraph({ children: [ new TextRun({ text: e.prompt, italics: true }) ] }));
      children.push(new Paragraph({ text: e.text }));
    });
  }
  const doc = new Document({ sections: [{ children }] });
  return Packer.toBlob(doc);
}

function triggerBlobDownload(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function downloadBookOnlyWord(){
  try{
    const blob = await buildWordDoc(false, null);
    triggerBlobDownload(blob, 'iyipada-iyanu-iwalaaye-yoruba.docx');
  }catch(e){ alert('Download failed: ' + e.message); }
}

async function downloadBookWithNotesWord(journal){
  try{
    const blob = await buildWordDoc(true, journal);
    triggerBlobDownload(blob, 'iyipada-iyanu-iwalaaye-yoruba-with-notes.docx');
  }catch(e){ alert('Download failed: ' + e.message); }
}

async function downloadBookWithNotes(journal){
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    await loadPdfFont(doc);
    let text = buildFullText();
    text += '\n\nÀKỌSÍLẸ̀ MI\n\n';
    journal.slice().reverse().forEach(e => {
      text += '[' + e.category + (e.chapterTitle ? ' - ' + e.chapterTitle : '') + '] ' + new Date(e.date).toLocaleDateString() + '\n' + e.text + '\n\n';
    });
    const lines = doc.splitTextToSize(text, 180);
    let y = 20;
    lines.forEach(line => { if(y > 280){ doc.addPage(); doc.setFont('DejaVuSans'); y = 20; } doc.text(line, 15, y); y += 7; });
    doc.save('iyipada-iyanu-iwalaaye-yoruba-with-notes.pdf');
  }catch(e){ alert('Download failed: ' + e.message); }
}
